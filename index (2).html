<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Ticket – What to watch tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#2a0f1a;--wine2:#3d1626;--cream:#f3e6cf;--gold:#e0a83a;--ink:#1c0b12;--rose:#b98a98}
*{box-sizing:border-box;margin:0}
body{background:var(--wine);color:var(--cream);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.6}
header{padding:44px 18px 28px;text-align:center;background:linear-gradient(var(--wine2),var(--wine))}
header h1{font-family:'Abril Fatface',Georgia,serif;font-size:clamp(2.2rem,8vw,4.4rem);line-height:1.1;font-weight:400;color:var(--gold)}
header p{max-width:32rem;margin:12px auto 0;color:var(--rose)}
section{max-width:1100px;margin:0 auto;padding:20px 14px 12px}
section h2{font-family:'Abril Fatface',Georgia,serif;font-weight:400;font-size:1.7rem;color:var(--cream);margin:0 4px 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.ticket{background:var(--cream);color:var(--ink);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.media{text-decoration:none;cursor:pointer;aspect-ratio:2/3;background:linear-gradient(160deg,#6b2540,#2a0f1a);display:grid;place-items:center;font-family:'Abril Fatface',serif;font-size:3.4rem;color:var(--gold);overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.stub{position:relative;padding:18px 12px 12px;border-top:2px dashed #b99a7a}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--wine)}
.stub::before{left:-10px}.stub::after{right:-10px}
.stub h3{font-size:1rem;line-height:1.3;font-weight:600;margin-bottom:10px}
.btn{display:block;text-align:center;padding:10px 6px;border-radius:8px;background:var(--wine);color:var(--cream);text-decoration:none;font-weight:600}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink);outline:none}
footer{text-align:center;padding:30px 18px 40px;color:var(--rose);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>What to watch tonight</h1>
  <p>Fresh picks, trailers and downloads in one place. Tap a card to get started.</p>
</header>

<section>
  <h2>Watch</h2>
  <div class="grid" id="watch"></div>
</section>

<section>
  <h2>Download</h2>
  <div class="grid" id="download"></div>
</section>

<footer>Some links on this site are affiliate links. We may earn a commission at no extra cost to you.</footer>

<script>
/* ===== EDIT HERE =====
   Each box = one { } block.
   title : text under the picture
   image : picture file name (e.g. "movie1.jpg"), or "" to show a letter
   video : video file name (e.g. "clip1.mp4"), or "" for picture only
   link  : your affiliate link (direct link or smart link)
   To add a box, copy one block, add a comma, and paste it at the end. */

const watchItems = [
  { title: "Movie title 1", image: "movie1.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 2", image: "movie2.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 3", image: "movie3.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 4", image: "movie4.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" }
];

const downloadItems = [
  { title: "Movie title 5", image: "movie5.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 6", image: "movie6.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 7", image: "movie7.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" },
  { title: "Movie title 8", image: "movie8.jpg", video: "", link: "https://seriousstaunch.com/guvmi3b2y?key=11432b86f8f19c3d28cb8ad56e77f61d" }
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function box(m,label){
  const letter=esc(m.title).charAt(0);
  let media=letter;
  if(m.video){
    media=`<video src="${esc(m.video)}" ${m.image?`poster="${esc(m.image)}"`:''} muted loop autoplay playsinline preload="metadata"></video>`;
  }else if(m.image){
    media=`<img src="${esc(m.image)}" alt="${esc(m.title)}" loading="lazy" onerror="this.parentNode.textContent='${letter}'">`;
  }
  return `<article class="ticket">
    <a class="media" href="${esc(m.link)}" target="_blank" rel="sponsored noopener" aria-label="${esc(m.title)}">${media}</a>
    <div class="stub">
      <h3>${esc(m.title)}</h3>
      <a class="btn" href="${esc(m.link)}" target="_blank" rel="sponsored noopener">${label}</a>
    </div>
  </article>`;
}
document.getElementById('watch').innerHTML=watchItems.map(m=>box(m,'Watch More')).join('');
document.getElementById('download').innerHTML=downloadItems.map(m=>box(m,'Download Now')).join('');
</script>
</body>
</html>
